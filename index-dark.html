<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camille Moreau — redirecting</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://camilleelot.github.io/">
<script>
  // The dark index now lives inside index.html (data-theme attribute).
  // Landing here means the visitor wants dark, unless they explicitly chose light.
  try {
    if (localStorage.getItem('theme') !== 'light') localStorage.setItem('theme', 'dark');
  } catch (e) {}
  location.replace('index.html');
</script>
<meta http-equiv="refresh" content="0; url=index.html">
<style>body { background: #17140f; color: #f2ece0; font-family: Georgia, serif; padding: 48px; }</style>
</head>
<body>
  <p><a href="index.html" style="color:inherit">Continue to camilleelot.github.io &rarr;</a></p>
</body>
</html>
